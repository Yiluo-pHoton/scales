<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Practice — Tempo Trainer</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #f39c12;
    --root: #e74c3c;
    --note: #3498db;
    --green: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 700px; margin: 0 auto; padding: 20px;
  }
  .nav-link {
    font-size: 13px; color: var(--muted); text-decoration: none;
    display: inline-block; margin-bottom: 12px;
  }
  .nav-link:hover { color: var(--text); }
  h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  /* ── Tempo control ── */
  .tempo-section {
    background: var(--panel); border-radius: 12px; padding: 24px;
    text-align: center; margin-bottom: 20px;
  }
  .tempo-display {
    font-size: 72px; font-weight: 700; letter-spacing: -2px;
    margin: 8px 0; cursor: default; user-select: none;
  }
  .tempo-label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .tempo-controls {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 16px 0 12px;
  }
  .tempo-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #333; color: var(--text); border: 1px solid #555;
    font-size: 22px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    line-height: 1; padding: 0;
  }
  .tempo-btn:hover { background: #444; }
  .tempo-btn:active { background: #555; }
  .tempo-slider {
    flex: 1; max-width: 300px; accent-color: var(--accent);
    height: 6px; cursor: pointer;
  }
  .tap-btn {
    padding: 10px 24px; background: var(--accent); color: #111;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  .tap-btn:hover { filter: brightness(1.1); }
  .tap-btn:active { filter: brightness(0.9); }

  /* ── Settings row ── */
  .settings {
    display: flex; flex-wrap: wrap; gap: 16px;
    margin-bottom: 20px; align-items: flex-start;
  }
  .setting-group {
    background: var(--panel); border-radius: 8px; padding: 14px 16px;
    flex: 1; min-width: 180px;
  }
  .setting-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 8px;
  }
  .setting-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt-btn {
    padding: 6px 14px; background: #333; color: var(--text);
    border: 1px solid #444; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: all 0.15s;
  }
  .opt-btn:hover { border-color: #666; }
  .opt-btn.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

  /* ── Figure buttons ── */
  .figures-section {
    background: var(--panel); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 20px;
  }
  .figure-grid {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
  }
  .fig-btn {
    width: 70px; height: 64px; background: #333; border: 2px solid #444;
    border-radius: 8px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 4px;
    transition: all 0.15s;
  }
  .fig-btn:hover { border-color: #666; }
  .fig-btn.active { border-color: var(--accent); background: #3a3020; }
  .fig-btn svg { width: 60px; height: 36px; }
  .fig-btn .fig-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .fig-btn.active .fig-label { color: var(--accent); }
  .fig-select-row {
    display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .fig-select-btn {
    padding: 4px 12px; background: none; border: 1px solid #555;
    color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .fig-select-btn:hover { color: var(--text); border-color: #888; }

  /* ── Now playing / Next up ── */
  .playback-area {
    background: var(--panel); border-radius: 12px; padding: 24px;
    text-align: center; margin-bottom: 20px; min-height: 200px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .now-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .now-figure svg { height: 60px; }
  .next-label { font-size: 11px; color: var(--muted); margin-top: 20px; text-transform: uppercase; letter-spacing: 0.8px; }
  .next-figure svg { height: 36px; opacity: 0.5; margin-top: 4px; }
  .beat-dots {
    display: flex; gap: 10px; margin-top: 16px;
  }
  .beat-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #444; transition: background 0.08s;
  }
  .beat-dot.on { background: var(--accent); }
  .beat-dot.downbeat.on { background: var(--root); }
  .bar-counter { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ── Transport ── */
  .transport {
    display: flex; justify-content: center; gap: 16px; margin-bottom: 24px;
  }
  .play-stop-btn {
    padding: 14px 40px; border-radius: 10px; font-size: 16px;
    font-weight: 600; cursor: pointer; border: none;
  }
  .play-stop-btn.play { background: var(--green); color: #111; }
  .play-stop-btn.play:hover { filter: brightness(1.1); }
  .play-stop-btn.stop { background: var(--root); color: #fff; }
  .play-stop-btn.stop:hover { filter: brightness(1.1); }

  /* ── Staff notation rendering ── */
  .staff-note { fill: var(--text); }
  .staff-line-stroke { stroke: var(--muted); stroke-width: 1; }
  .staff-beam { fill: var(--text); }
  .staff-stem { stroke: var(--text); stroke-width: 1.5; }
</style>
</head>
<body>

<h1>Rhythm Practice</h1>
<div class="subtitle">Metronome-based rhythm trainer — practice subdivisions with staff notation.</div>

<!-- Tempo -->
<div class="tempo-section">
  <div class="tempo-label">BPM</div>
  <div class="tempo-display" id="tempoDisplay">120</div>
  <div class="tempo-controls">
    <button class="tempo-btn" id="tempoMinus5" title="-5">−</button>
    <input type="range" class="tempo-slider" id="tempoSlider" min="30" max="300" value="120">
    <button class="tempo-btn" id="tempoPlus5" title="+5">+</button>
  </div>
  <button class="tap-btn" id="tapBtn">Tap Tempo</button>
</div>

<!-- Settings -->
<div class="settings">
  <div class="setting-group">
    <div class="setting-label">Beats per Bar</div>
    <div class="setting-row" id="beatsRow"></div>
  </div>
  <div class="setting-group">
    <div class="setting-label">Bars per Figure</div>
    <div class="setting-row" id="barsRow"></div>
  </div>
  <div class="setting-group">
    <div class="setting-label">Click Sound</div>
    <div class="setting-row" id="clickRow"></div>
  </div>
</div>

<!-- Figures -->
<div class="figures-section">
  <div class="setting-label">Rhythmic Figures</div>
  <div class="fig-select-row">
    <button class="fig-select-btn" id="figAll">All</button>
    <button class="fig-select-btn" id="figNone">None</button>
    <span style="flex:1;"></span>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;">
      <input type="checkbox" id="randomToggle" checked> Random order
    </label>
  </div>
  <div class="figure-grid" id="figureGrid"></div>
</div>

<!-- Playback area -->
<div class="playback-area" id="playbackArea">
  <div class="now-label">Select figures and press Play</div>
</div>

<!-- Transport -->
<div class="transport">
  <button class="play-stop-btn play" id="transportBtn">▶ Play</button>
</div>

<script>
// ══════════════════════════════════════════
// Staff notation SVG builders
// ══════════════════════════════════════════

function staffSVG(inner, w, h) {
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

// Single staff (5 lines), y from staffY
function staffLines(w, staffY, gap) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    s += `<line x1="0" x2="${w}" y1="${staffY + i*gap}" y2="${staffY + i*gap}" class="staff-line-stroke"/>`;
  }
  return s;
}

// Whole note (open oval, no stem)
function wholeNote(cx, cy) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="7" ry="5" fill="none" stroke="var(--text)" stroke-width="2"/>`;
}

// Half note (open oval, stem up)
function halfNote(cx, cy) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="5.5" ry="4" fill="none" stroke="var(--text)" stroke-width="1.8"/>` +
    `<line x1="${cx+5}" x2="${cx+5}" y1="${cy}" y2="${cy-28}" class="staff-stem"/>`;
}

// Filled notehead
function noteHead(cx, cy) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="5" ry="3.8" class="staff-note" transform="rotate(-10,${cx},${cy})"/>`;
}

// Quarter note (filled, stem up)
function quarterNote(cx, cy) {
  return noteHead(cx, cy) +
    `<line x1="${cx+4.5}" x2="${cx+4.5}" y1="${cy}" y2="${cy-28}" class="staff-stem"/>`;
}

// Beamed group: n notes evenly spaced, with beam(s) on top
function beamedGroup(startX, cy, n, beams, w) {
  const spacing = w / n;
  let s = '';
  const stemTop = cy - 28;
  for (let i = 0; i < n; i++) {
    const cx = startX + spacing * (i + 0.5);
    s += noteHead(cx, cy);
    s += `<line x1="${cx+4.5}" x2="${cx+4.5}" y1="${cy}" y2="${stemTop}" class="staff-stem"/>`;
  }
  // Beams
  const x1 = startX + spacing * 0.5 + 4.5;
  const x2 = startX + spacing * (n - 0.5) + 4.5;
  for (let b = 0; b < beams; b++) {
    const by = stemTop + b * 6;
    s += `<rect x="${x1}" y="${by}" width="${x2-x1}" height="3.5" class="staff-beam" rx="0.5"/>`;
  }
  return s;
}

// Build notation SVGs for each figure
// Each returns an SVG string
const FIGURES = {
  whole:   { name: "1",  divisor: 1,  label: "Whole" },
  half:    { name: "½",  divisor: 2,  label: "Half" },
  quarter: { name: "♩",  divisor: 4,  label: "Quarter" },
  eighth:  { name: "♪",  divisor: 8,  label: "8th" },
  triplet: { name: "3",  divisor: 12, label: "Triplet" },
  sixteenth:{ name: "𝅘𝅥𝅯", divisor: 16, label: "16th" },
  fivelet: { name: "5",  divisor: 20, label: "5-plet" },
  sixlet:  { name: "6",  divisor: 24, label: "6-plet" },
  sevenlet:{ name: "7",  divisor: 28, label: "7-plet" },
};
const FIGURE_ORDER = ["whole","half","quarter","eighth","triplet","sixteenth","fivelet","sixlet","sevenlet"];

function buildFigureSVG(key, large) {
  const sg = large ? 6 : 4; // staff gap
  const h = large ? 60 : 36;
  const w = large ? 200 : 60;
  const staffY = large ? 18 : 10;
  const cy = staffY + sg * 3; // note on middle line

  let inner = staffLines(w, staffY, sg);

  if (key === "whole") {
    inner += wholeNote(w/2, cy);
  } else if (key === "half") {
    if (large) {
      // 2 half notes
      inner += halfNote(w*0.3, cy);
      inner += halfNote(w*0.7, cy);
    } else {
      inner += halfNote(w/2, cy);
    }
  } else if (key === "quarter") {
    if (large) {
      for (let i = 0; i < 4; i++) inner += quarterNote(w*(i+0.5)/4, cy);
    } else {
      inner += quarterNote(w/2, cy);
    }
  } else if (key === "eighth") {
    inner += beamedGroup(large ? w*0.05 : 2, cy, large ? 8 : 2, 1, large ? w*0.9 : w-4);
  } else if (key === "triplet") {
    const n = large ? 6 : 3;  // show 2 beats large, 1 beat small
    const gw = large ? w*0.9 : w-4;
    const sx = large ? w*0.05 : 2;
    inner += beamedGroup(sx, cy, n, 1, gw);
    // Triplet bracket: "3" above each group of 3
    const groups = large ? 2 : 1;
    const groupW = gw / groups;
    for (let g = 0; g < groups; g++) {
      const gx = sx + g * groupW;
      const mid = gx + groupW / 2;
      inner += `<text x="${mid}" y="${staffY - 2}" text-anchor="middle" font-size="${large?11:8}" fill="var(--accent)" font-weight="600">3</text>`;
    }
  } else if (key === "sixteenth") {
    inner += beamedGroup(large ? w*0.05 : 2, cy, large ? 8 : 4, 2, large ? w*0.9 : w-4);
  } else if (key === "fivelet") {
    const n = large ? 5 : 5;
    inner += beamedGroup(large ? w*0.05 : 2, cy, n, 1, large ? w*0.9 : w-4);
    const mid = w / 2;
    inner += `<text x="${mid}" y="${staffY - 2}" text-anchor="middle" font-size="${large?11:8}" fill="var(--accent)" font-weight="600">5</text>`;
  } else if (key === "sixlet") {
    const n = large ? 6 : 6;
    inner += beamedGroup(large ? w*0.05 : 2, cy, n, 1, large ? w*0.9 : w-4);
    const mid = w / 2;
    inner += `<text x="${mid}" y="${staffY - 2}" text-anchor="middle" font-size="${large?11:8}" fill="var(--accent)" font-weight="600">6</text>`;
  } else if (key === "sevenlet") {
    const n = large ? 7 : 7;
    inner += beamedGroup(large ? w*0.05 : 2, cy, n, 1, large ? w*0.9 : w-4);
    const mid = w / 2;
    inner += `<text x="${mid}" y="${staffY - 2}" text-anchor="middle" font-size="${large?11:8}" fill="var(--accent)" font-weight="600">7</text>`;
  }

  return staffSVG(inner, w, h);
}

// ══════════════════════════════════════════
// State
// ══════════════════════════════════════════
let tempo = 120;
let beatsPerBar = 4;
let barsPerFigure = 2;
let clickMode = "quarter"; // "downbeat", "quarter", "division"
let activeFigures = new Set(["quarter","eighth","triplet","sixteenth"]);
let randomOrder = true;
let isPlaying = false;
let audioCtx = null;
let schedulerTimer = null;

// ══════════════════════════════════════════
// Tempo UI
// ══════════════════════════════════════════
const tempoDisplay = document.getElementById("tempoDisplay");
const tempoSlider = document.getElementById("tempoSlider");

function setTempo(v) {
  tempo = Math.max(30, Math.min(300, Math.round(v)));
  tempoDisplay.textContent = tempo;
  tempoSlider.value = tempo;
}

tempoSlider.addEventListener("input", () => setTempo(+tempoSlider.value));
document.getElementById("tempoMinus5").addEventListener("click", () => setTempo(tempo - 5));
document.getElementById("tempoPlus5").addEventListener("click", () => setTempo(tempo + 5));

// Tap tempo
let tapTimes = [];
document.getElementById("tapBtn").addEventListener("click", () => {
  const now = performance.now();
  tapTimes.push(now);
  if (tapTimes.length > 6) tapTimes.shift();
  if (tapTimes.length >= 2) {
    const intervals = [];
    for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
    const avg = intervals.reduce((a,b) => a+b, 0) / intervals.length;
    setTempo(60000 / avg);
  }
  // Reset if gap > 2s
  if (tapTimes.length >= 2 && tapTimes[tapTimes.length-1] - tapTimes[tapTimes.length-2] > 2000) {
    tapTimes = [now];
  }
});

// ══════════════════════════════════════════
// Settings buttons
// ══════════════════════════════════════════
function buildOptRow(containerId, options, defaultVal, onChange) {
  const container = document.getElementById(containerId);
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (opt.value === defaultVal ? " active" : "");
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      container.querySelectorAll(".opt-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      onChange(opt.value);
    });
    container.appendChild(btn);
  });
}

buildOptRow("beatsRow",
  [2,3,4,5,6,7].map(n => ({ label: n, value: n })),
  4, v => { beatsPerBar = v; }
);
buildOptRow("barsRow",
  [1,2,4,8].map(n => ({ label: n, value: n })),
  2, v => { barsPerFigure = v; }
);
buildOptRow("clickRow",
  [
    { label: "Downbeat", value: "downbeat" },
    { label: "Quarter", value: "quarter" },
    { label: "All", value: "division" },
  ],
  "quarter", v => { clickMode = v; }
);

// ══════════════════════════════════════════
// Figure buttons
// ══════════════════════════════════════════
const figureGrid = document.getElementById("figureGrid");

FIGURE_ORDER.forEach(key => {
  const btn = document.createElement("button");
  btn.className = "fig-btn" + (activeFigures.has(key) ? " active" : "");
  btn.innerHTML = buildFigureSVG(key, false) + `<span class="fig-label">${FIGURES[key].label}</span>`;
  btn.addEventListener("click", () => {
    if (activeFigures.has(key)) {
      activeFigures.delete(key);
      btn.classList.remove("active");
    } else {
      activeFigures.add(key);
      btn.classList.add("active");
    }
  });
  btn.dataset.figure = key;
  figureGrid.appendChild(btn);
});

document.getElementById("figAll").addEventListener("click", () => {
  FIGURE_ORDER.forEach(k => activeFigures.add(k));
  figureGrid.querySelectorAll(".fig-btn").forEach(b => b.classList.add("active"));
});
document.getElementById("figNone").addEventListener("click", () => {
  activeFigures.clear();
  figureGrid.querySelectorAll(".fig-btn").forEach(b => b.classList.remove("active"));
});
document.getElementById("randomToggle").addEventListener("change", e => {
  randomOrder = e.target.checked;
});

// ══════════════════════════════════════════
// Audio — classic tick/click
// ══════════════════════════════════════════
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playClick(ctx, time, isDownbeat, isSubdivision) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain).connect(ctx.destination);

  if (isDownbeat) {
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.5, time);
  } else if (isSubdivision) {
    osc.frequency.value = 600;
    gain.gain.setValueAtTime(0.12, time);
  } else {
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.3, time);
  }
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
  osc.start(time);
  osc.stop(time + 0.05);
}

// ══════════════════════════════════════════
// Scheduler — look-ahead metronome
// ══════════════════════════════════════════
let currentBeat = 0;
let currentBar = 0;
let currentFigureIdx = 0;
let figureQueue = [];
let nextNoteTime = 0;
let currentSubdiv = 0;

function getActiveList() {
  const list = FIGURE_ORDER.filter(k => activeFigures.has(k));
  return list.length > 0 ? list : ["quarter"];
}

function buildQueue() {
  const list = getActiveList();
  if (randomOrder) {
    // Shuffle
    figureQueue = list.slice();
    for (let i = figureQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [figureQueue[i], figureQueue[j]] = [figureQueue[j], figureQueue[i]];
    }
  } else {
    figureQueue = list.slice();
  }
  currentFigureIdx = 0;
}

function currentFigure() {
  if (figureQueue.length === 0) buildQueue();
  return figureQueue[currentFigureIdx % figureQueue.length];
}
function nextFigure() {
  if (figureQueue.length === 0) buildQueue();
  return figureQueue[(currentFigureIdx + 1) % figureQueue.length];
}
function advanceFigure() {
  currentFigureIdx++;
  if (currentFigureIdx >= figureQueue.length) buildQueue();
}

function updatePlaybackUI() {
  const area = document.getElementById("playbackArea");
  const fig = currentFigure();
  const nxt = nextFigure();

  let dotsHTML = '<div class="beat-dots">';
  for (let i = 0; i < beatsPerBar; i++) {
    const cls = i === currentBeat ? " on" : "";
    const db = i === 0 ? " downbeat" : "";
    dotsHTML += `<div class="beat-dot${db}${cls}"></div>`;
  }
  dotsHTML += '</div>';

  area.innerHTML =
    `<div class="now-label">Now Playing</div>` +
    `<div class="now-figure">${buildFigureSVG(fig, true)}</div>` +
    dotsHTML +
    `<div class="bar-counter">Bar ${currentBar + 1} of ${barsPerFigure}</div>` +
    `<div class="next-label">Next Up</div>` +
    `<div class="next-figure">${buildFigureSVG(nxt, false)}</div>`;
}

const SCHEDULE_AHEAD = 0.1; // seconds
const LOOKAHEAD_MS = 25;

function scheduler() {
  const ctx = getAudioCtx();
  const fig = currentFigure();
  const divisor = FIGURES[fig].divisor; // subdivisions per bar (whole=1 means 1 per bar, etc.)
  // divisor is per whole note; per beat = divisor / beatsPerBar...
  // Actually divisor represents notes-per-4-beats (standard time). Let's adapt:
  // whole=1 per 4 beats, half=2 per 4 beats, quarter=4 per 4 beats, etc.
  // Per beat: subPerBeat = divisor / 4
  const subPerBeat = divisor / 4;
  const beatDuration = 60.0 / tempo;
  const subDuration = beatDuration / subPerBeat;

  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
    const isDownbeat = (currentBeat === 0 && currentSubdiv === 0);
    const isBeatStart = (currentSubdiv === 0);
    const isSubdivision = !isBeatStart;

    // Decide if we click
    if (clickMode === "downbeat" && isDownbeat) {
      playClick(ctx, nextNoteTime, true, false);
    } else if (clickMode === "quarter" && isBeatStart) {
      playClick(ctx, nextNoteTime, isDownbeat, false);
    } else if (clickMode === "division") {
      playClick(ctx, nextNoteTime, isDownbeat, isSubdivision);
    }

    // Advance subdivision
    currentSubdiv++;
    if (currentSubdiv >= subPerBeat) {
      currentSubdiv = 0;
      currentBeat++;
      // Schedule UI update on beat change
      const beatCopy = currentBeat;
      const barCopy = currentBar;
      const delay = Math.max(0, (nextNoteTime - ctx.currentTime) * 1000);
      setTimeout(() => {
        if (!isPlaying) return;
        // Check for beat/bar boundary before updating UI
        updatePlaybackUI();
      }, delay);

      if (currentBeat >= beatsPerBar) {
        currentBeat = 0;
        currentBar++;
        if (currentBar >= barsPerFigure) {
          currentBar = 0;
          advanceFigure();
        }
      }
    }

    nextNoteTime += subDuration;
  }
}

function startPlayback() {
  const ctx = getAudioCtx();
  if (ctx.state === "suspended") ctx.resume();

  currentBeat = 0;
  currentBar = 0;
  currentSubdiv = 0;
  buildQueue();
  nextNoteTime = ctx.currentTime + 0.1;

  isPlaying = true;
  updatePlaybackUI();
  schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);

  const btn = document.getElementById("transportBtn");
  btn.textContent = "■ Stop";
  btn.className = "play-stop-btn stop";
}

function stopPlayback() {
  isPlaying = false;
  if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }

  const btn = document.getElementById("transportBtn");
  btn.textContent = "▶ Play";
  btn.className = "play-stop-btn play";

  const area = document.getElementById("playbackArea");
  area.innerHTML = '<div class="now-label">Select figures and press Play</div>';
}

document.getElementById("transportBtn").addEventListener("click", () => {
  if (isPlaying) stopPlayback(); else startPlayback();
});

// Keyboard shortcut: space = play/stop
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") {
    e.preventDefault();
    if (isPlaying) stopPlayback(); else startPlayback();
  }
});
</script>
</body>
