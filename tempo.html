<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap">
<title>Rhythm Practice — Tempo Trainer</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #f39c12;
    --root: #e74c3c;
    --note: #3498db;
    --green: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 20px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 960px;
  }
  .nav-link {
    font-size: 13px; color: var(--muted); text-decoration: none;
    display: inline-block; margin-bottom: 12px;
  }
  .nav-link:hover { color: var(--text); }
  h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  /* ── Main 3-column grid ── */
  .main-grid {
    display: grid;
    grid-template-columns: 180px 1fr 180px;
    gap: 16px;
    margin-bottom: 20px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    .side-settings { display: flex; gap: 12px; flex-wrap: wrap; }
    .side-settings .setting-group { flex: 1; min-width: 140px; }
  }

  /* ── Side setting panels ── */
  .side-settings {
    display: flex; flex-direction: column; gap: 12px;
  }
  .setting-group {
    background: var(--panel); border-radius: 8px; padding: 12px 14px;
  }
  .setting-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 8px;
  }
  .setting-col { display: flex; flex-direction: column; gap: 5px; }
  .setting-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .opt-btn {
    padding: 5px 10px; background: #333; color: var(--text);
    border: 1px solid #444; border-radius: 6px; cursor: pointer;
    font-size: 12px; transition: all 0.15s; text-align: center;
  }
  .opt-btn:hover { border-color: #666; }
  .opt-btn.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

  /* ── Time signature buttons ── */
  .ts-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 3px 7px; background: #333; color: var(--text);
    border: 1px solid #444; border-radius: 6px; cursor: pointer;
    font-weight: 700; line-height: 1;
    transition: all 0.15s; min-width: 32px; gap: 1px;
  }
  .ts-btn:hover { border-color: #666; }
  .ts-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }
  .ts-num { font-size: 14px; font-weight: 700; }
  .ts-line { width: 14px; height: 1.5px; background: currentColor; }
  .ts-den { font-size: 14px; font-weight: 700; }

  /* ── Tempo control ── */
  .tempo-row {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .tempo-display {
    font-size: 20px; font-weight: 700; letter-spacing: -1px;
    min-width: 34px; text-align: center; cursor: default; user-select: none;
  }
  .tempo-btn {
    width: 26px; height: 26px; border-radius: 50%;
    background: #333; color: var(--text); border: 1px solid #555;
    font-size: 15px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    line-height: 1; padding: 0;
  }
  .tempo-btn:hover { background: #444; }
  .tempo-btn:active { background: #555; }
  .tempo-slider {
    flex: 1; min-width: 50px; accent-color: var(--accent);
    height: 5px; cursor: pointer;
  }
  .tap-btn {
    padding: 4px 10px; background: var(--accent); color: #111;
    border: none; border-radius: 5px; font-size: 11px; font-weight: 600;
    cursor: pointer;
  }
  .tap-btn:hover { filter: brightness(1.1); }
  .tap-btn:active { filter: brightness(0.9); }

  /* ── Playback area (center column) ── */
  .center-column {
    display: flex; flex-direction: column; gap: 12px;
  }
  .playback-area {
    background: var(--panel); border-radius: 12px; padding: 28px 20px;
    text-align: center; min-height: 220px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .now-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .now-figure svg { height: 80px; }
  .next-label { font-size: 11px; color: var(--muted); margin-top: 16px; text-transform: uppercase; letter-spacing: 0.8px; }
  .next-figure svg { height: 54px; opacity: 0.5; margin-top: 4px; }
  .beat-dots {
    display: flex; gap: 14px; margin-top: 14px;
  }
  .beat-dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: #333; border: 2px solid #555;
    transition: all 0.06s;
  }
  .beat-dot.on {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px 4px rgba(243,156,18,0.5);
    transform: scale(1.25);
  }
  .beat-dot.downbeat.on {
    background: var(--root);
    border-color: var(--root);
    box-shadow: 0 0 14px 5px rgba(231,76,60,0.55);
    transform: scale(1.35);
  }
  .bar-counter { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ── Transport ── */
  .transport {
    display: flex; justify-content: center;
  }
  .play-stop-btn {
    padding: 12px 36px; border-radius: 10px; font-size: 15px;
    font-weight: 600; cursor: pointer; border: none;
  }
  .play-stop-btn.play { background: var(--green); color: #111; }
  .play-stop-btn.play:hover { filter: brightness(1.1); }
  .play-stop-btn.stop { background: var(--root); color: #fff; }
  .play-stop-btn.stop:hover { filter: brightness(1.1); }

  /* ── Figure buttons ── */
  .figures-section {
    background: var(--panel); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 20px;
  }
  .figure-grid {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
  }
  .fig-btn {
    width: 80px; height: 72px; background: #333; border: 2px solid #444;
    border-radius: 8px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 4px;
    transition: all 0.15s;
  }
  .fig-btn:hover { border-color: #666; }
  .fig-btn.active { border-color: var(--accent); background: #3a3020; }
  .fig-btn svg { width: 68px; height: 44px; }
  .fig-btn .fig-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .fig-btn.active .fig-label { color: var(--accent); }

  /* ── Category tabs ── */
  .cat-tabs {
    display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .cat-tab {
    padding: 5px 11px; background: #333; color: var(--muted);
    border: 1px solid #444; border-radius: 6px; cursor: pointer;
    font-size: 11px; transition: all 0.15s;
  }
  .cat-tab:hover { border-color: #666; color: var(--text); }
  .cat-tab.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

  .fig-select-row {
    display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .fig-select-btn {
    padding: 4px 12px; background: none; border: 1px solid #555;
    color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .fig-select-btn:hover { color: var(--text); border-color: #888; }

  /* ── Staff notation rendering ── */
  .staff-note { fill: var(--text); }
  .staff-line-stroke { stroke: var(--muted); stroke-width: 1; }
  .staff-beam { fill: var(--text); }
  .staff-stem { stroke: var(--text); stroke-width: 1.5; }
</style>
</head>

<h1>Rhythm Practice</h1>
<div class="subtitle">Metronome-based rhythm trainer — practice subdivisions with staff notation.</div>

<!-- 3-column layout: settings | playback | settings -->
<div class="main-grid">

  <!-- Left settings -->
  <div class="side-settings">
    <div class="setting-group">
      <div class="setting-label">Tempo (BPM)</div>
      <div class="tempo-row">

      </div>
      <div style="margin-top:6px;">
        <input type="range" class="tempo-slider" id="tempoSlider" min="30" max="300" value="80" style="width:100%;">
      </div>

    </div>

    </div>

    </div>

<!-- Figures -->
<div class="figures-section">
  <div class="setting-label">Rhythmic Figures</div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Select which rhythms to practice. Active figures will cycle during playback.</div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="fig-select-row">
    <button class="fig-select-btn" id="figAll">All</button>
    <button class="fig-select-btn" id="figNone">None</button>

    </label>

  <div class="figure-grid" id="figureGrid"></div>

<script>
// ══════════════════════════════════════════
// Staff notation SVG builders
// ══════════════════════════════════════════

function staffSVG(inner, w, h) {
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

// Single staff (5 lines), y from staffY
function staffLines(w, staffY, gap) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    s += `<line x1="0" x2="${w}" y1="${staffY + i*gap}" y2="${staffY + i*gap}" class="staff-line-stroke"/>`;
  }
  return s;
}

// Whole note (open oval, no stem)
function wholeNote(cx, cy) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="6" ry="4.2" fill="none" stroke="var(--text)" stroke-width="1.8"/>`;
}

// Half note (open oval, stem up)
function halfNote(cx, cy) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="4.2" ry="3.2" fill="none" stroke="var(--text)" stroke-width="1.5"/>` +
    `<line x1="${cx+3.8}" x2="${cx+3.8}" y1="${cy}" y2="${cy-22}" class="staff-stem"/>`;
}

// Filled notehead
function noteHead(cx, cy) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="3.8" ry="2.8" class="staff-note" transform="rotate(-10,${cx},${cy})"/>`;
}

// Quarter note (filled, stem up)
function quarterNote(cx, cy) {
  return noteHead(cx, cy) +
    `<line x1="${cx+3.5}" x2="${cx+3.5}" y1="${cy}" y2="${cy-22}" class="staff-stem"/>`;
}

// Beamed group: n notes evenly spaced, with beam(s) on top
function beamedGroup(startX, cy, n, beams, w) {
  const spacing = w / n;
  let s = '';
  const stemTop = cy - 22;
  for (let i = 0; i < n; i++) {
    const cx = startX + spacing * (i + 0.5);
    s += noteHead(cx, cy);
    s += `<line x1="${cx+3.5}" x2="${cx+3.5}" y1="${cy}" y2="${stemTop}" class="staff-stem"/>`;
  }
  // Beams
  const x1 = startX + spacing * 0.5 + 3.5;
  const x2 = startX + spacing * (n - 0.5) + 3.5;
  for (let b = 0; b < beams; b++) {
    const by = stemTop + b * 5;
    s += `<rect x="${x1}" y="${by}" width="${x2-x1}" height="3" class="staff-beam" rx="0.5"/>`;
  }
  return s;
}

// Tuplet bracket: horizontal bar spanning group with number above
function tupletBracket(x1, x2, y, num, fontSize) {
  const mid = (x1 + x2) / 2;
  const bracketY = y;
  const tickH = 3;
  return `<line x1="${x1}" x2="${x2}" y1="${bracketY}" y2="${bracketY}" stroke="var(--accent)" stroke-width="1.5"/>` +
    `<line x1="${x1}" x2="${x1}" y1="${bracketY}" y2="${bracketY+tickH}" stroke="var(--accent)" stroke-width="1.5"/>` +
    `<line x1="${x2}" x2="${x2}" y1="${bracketY}" y2="${bracketY+tickH}" stroke="var(--accent)" stroke-width="1.5"/>` +
    `<text x="${mid}" y="${bracketY-2}" text-anchor="middle" font-size="${fontSize}" fill="var(--accent)" font-weight="600">${num}</text>`;
}

// Build notation SVGs for each figure
// Each returns an SVG string
// ── Categories ──
const CATEGORIES = [
  { id: "all",   label: "All" },
  { id: "basic", label: "Basic" },
  { id: "A",     label: "A: 16th" },
  { id: "B",     label: "B: Triplet" },
  { id: "C",     label: "C: Sextuplet" },
  { id: "other", label: "Other" },
];

const FIGURES = {
  // ── Basic figures ──
  whole:     { cat: "basic", divisor: 1,  label: "Whole" },
  half:      { cat: "basic", divisor: 2,  label: "Half" },
  quarter:   { cat: "basic", divisor: 4,  label: "Quarter" },
  eighth:    { cat: "basic", divisor: 8,  label: "8th" },
  triplet:   { cat: "basic", divisor: 12, label: "Triplet" },
  sixteenth: { cat: "basic", divisor: 16, label: "16th" },
  fivelet:   { cat: "basic", divisor: 20, label: "5-let" },
  sixlet:    { cat: "basic", divisor: 24, label: "6-let" },
  sevenlet:  { cat: "basic", divisor: 28, label: "7-let" },

  // ── A: 16th-note patterns (4 subdivisions per beat) ──
  A1:  { cat: "A", divisor: 16, hits: [1,1,1,0], label: "A-1" },
  A2:  { cat: "A", divisor: 16, hits: [1,0,1,1], label: "A-2" },
  A3:  { cat: "A", divisor: 16, hits: [1,1,0,1], label: "A-3" },
  A4:  { cat: "A", divisor: 16, hits: [1,0,0,1], label: "A-4" },
  A5:  { cat: "A", divisor: 16, hits: [1,0,0,0], label: "A-5" },
  A6:  { cat: "A", divisor: 16, hits: [0,1,1,1], label: "A-6" },
  A7:  { cat: "A", divisor: 16, hits: [0,1,0,1], label: "A-7" },
  A8:  { cat: "A", divisor: 16, hits: [0,1,1,0], label: "A-8" },
  A9:  { cat: "A", divisor: 16, hits: [0,1,0,0], label: "A-9" },
  A10: { cat: "A", divisor: 16, hits: [0,0,1,0], label: "A-10" },
  A11: { cat: "A", divisor: 16, hits: [1,1,0,0], label: "A-11" },
  A12: { cat: "A", divisor: 16, hits: [0,0,1,1], label: "A-12" },
  A13: { cat: "A", divisor: 16, hits: [0,0,0,1], label: "A-13" },
  A14: { cat: "A", divisor: 16, hits: [1,0,1,0], label: "A-14" },
  A15: { cat: "A", divisor: 16, hits: [1,1,1,1], label: "A-15" },

  // ── B: Triplet patterns (3 subdivisions per beat) ──
  B1:  { cat: "B", divisor: 12, hits: [1,0,1], label: "B-1" },
  B2:  { cat: "B", divisor: 12, hits: [1,1,0], label: "B-2" },
  B3:  { cat: "B", divisor: 12, hits: [1,1,1], label: "B-3" },
  B4:  { cat: "B", divisor: 12, hits: [0,0,1], label: "B-4" },
  B5:  { cat: "B", divisor: 12, hits: [0,1,0], label: "B-5" },
  B6:  { cat: "B", divisor: 12, hits: [1,0,0], label: "B-6" },
  B7:  { cat: "B", divisor: 12, hits: [0,1,1], label: "B-7" },

  // ── C: Sextuplet patterns (6 subdivisions per beat) ──
  C1:  { cat: "C", divisor: 24, hits: [1,0,0,1,0,0], label: "C-1" },
  C2:  { cat: "C", divisor: 24, hits: [1,0,1,0,1,0], label: "C-2" },
  C3:  { cat: "C", divisor: 24, hits: [1,1,1,0,0,0], label: "C-3" },
  C4:  { cat: "C", divisor: 24, hits: [0,0,0,1,1,1], label: "C-4" },
  C5:  { cat: "C", divisor: 24, hits: [1,0,1,1,0,1], label: "C-5" },

  // ── Other: quintuplet / septuplet patterns ──
  O1:  { cat: "other", divisor: 20, hits: [1,0,1,0,1], label: "5a" },
  O2:  { cat: "other", divisor: 20, hits: [1,1,0,1,0], label: "5b" },
  O3:  { cat: "other", divisor: 20, hits: [1,0,0,1,0], label: "5c" },
  O4:  { cat: "other", divisor: 28, hits: [1,0,1,0,1,0,1], label: "7a" },
  O5:  { cat: "other", divisor: 28, hits: [1,1,0,1,0,1,0], label: "7b" },
  O6:  { cat: "other", divisor: 28, hits: [1,0,0,1,0,0,1], label: "7c" },
};

const FIGURE_ORDER = Object.keys(FIGURES);

// ── Rhythmic analysis helpers ──

// Parse a hit array into note/rest events with durations
// Notes sustain until the next attack; rests fill gaps before the first attack
function analyzeHitPattern(hits) {
  const n = hits.length, events = [];
  let i = 0;
  while (i < n) {
    if (hits[i]) {
      let j = i + 1;
      while (j < n && !hits[j]) j++;
      events.push({ pos: i, dur: j - i, type: 'note' });
      i = j;
    } else {
      let j = i;
      while (j < n && !hits[j]) j++;
      events.push({ pos: i, dur: j - i, type: 'rest' });
      i = j;
    }
  }
  return events;
}

// How many beams/flags does this note/rest duration need?
function evBeams(dur, sub) {
  if (sub <= 3) return dur >= 2 ? 0 : 1;
  if (dur >= sub) return 0;      // quarter-note level
  if (dur >= sub / 2) return 1;  // eighth-note level
  return 2;                      // sixteenth-note level
}

// Is this a dotted value? (only for sub=4, dur=3 = dotted eighth)
function isDotted(dur, sub) { return sub === 4 && dur === 3; }

// Draw a rest symbol at (cx, cy)
// Modelled after standard engraved music rests:
//   Quarter rest: zigzag / lightning-bolt shape
//   Eighth rest:  filled flag-dot at top + diagonal stem going down-left
//   Sixteenth rest: two flag-dots + longer diagonal stem
function restSym(cx, cy, dur, sub) {
  const dot = isDotted(dur, sub);
  const bc = evBeams(dot ? 2 : dur, sub);
  // Use Unicode musical rest characters rendered with Noto Music font
  let codepoint;
  if (bc === 0) codepoint = 0x1D13D;      // 𝄽 quarter rest
  else if (bc === 1) codepoint = 0x1D13E; // 𝄾 eighth rest
  else codepoint = 0x1D13F;               // 𝄿 sixteenth rest
  const char = String.fromCodePoint(codepoint);
  const fs = 22;
  let s = `<text x="${cx}" y="${cy+5}" font-family="'Noto Music', serif" font-size="${fs}" fill="var(--text)" text-anchor="middle">${char}</text>`;
  if (dot) s += `<circle cx="${cx+9}" cy="${cy}" r="1.5" fill="var(--text)"/>`;
  return s;
}

// Draw flag(s) curving from stem top
function flagSym(stemX, stemTop, count) {
  let s = '';
  for (let f = 0; f < count; f++) {
    const fy = stemTop + f * 6;
    s += `<path d="M${stemX},${fy} q5,3 3,9" fill="none" stroke="var(--text)" stroke-width="1.5"/>`;
  }
  return s;
}

function buildFigureSVG(key, large) {
  const fig = FIGURES[key];
  const sub = Math.round(fig.divisor / 4);
  const stemH = 22;
  const bracketH = large ? 18 : 16;
  const w = large ? 140 : 70;
  const cy = bracketH + stemH + (large ? 8 : 6);
  const h = cy + (large ? 8 : 6);
  const gw = w * 0.86;
  const startX = w * 0.07;
  const fs = large ? 12 : 10;
  let inner = '';

  // Basic single-note types
  if (key === "whole") { return staffSVG(wholeNote(w/2, cy), w, h); }
  if (key === "half")  { return staffSVG(halfNote(w/2, cy), w, h); }
  if (key === "quarter") { return staffSVG(quarterNote(w/2, cy), w, h); }
  if (sub < 2) return staffSVG('', w, h);

  const hits = fig.hits || new Array(sub).fill(1);
  const isTuplet = [3,5,6,7].includes(sub);
  const maxBeamLevels = sub <= 3 ? 1 : 2;
  const stemTop = cy - stemH;

  // Analyze into note/rest events with proper durations
  const events = analyzeHitPattern(hits);

  // Position proportionally (longer events get more horizontal space)
  let cum = 0;
  const positioned = events.map(ev => {
    const evW = (ev.dur / sub) * gw;
    const cx = startX + (cum / sub) * gw + evW / 2;
    cum += ev.dur;
    return { ...ev, cx };
  });

  // ── Draw rests ──
  positioned.filter(e => e.type === 'rest').forEach(ev => {
    inner += restSym(ev.cx, cy, ev.dur, sub);
  });

  // ── Draw notes (noteheads + stems + dots) ──
  const notes = positioned.filter(e => e.type === 'note');
  notes.forEach(ev => {
    inner += noteHead(ev.cx, cy);
    inner += `<line x1="${ev.cx+3.5}" x2="${ev.cx+3.5}" y1="${cy}" y2="${stemTop}" class="staff-stem"/>`;
    if (isDotted(ev.dur, sub)) {
      inner += `<circle cx="${ev.cx+6}" cy="${cy-2}" r="1.2" fill="var(--text)"/>`;
    }
  });

  // ── Beaming ──
  // Group consecutive notes that need beams (beamCount > 0)
  // Quarter-note-value notes and rests break beam groups
  const beamGroups = [];
  let curGroup = [];
  for (const ev of positioned) {
    if (ev.type === 'note' && evBeams(ev.dur, sub) > 0) {
      curGroup.push(ev);
    } else {
      if (curGroup.length) { beamGroups.push(curGroup); curGroup = []; }
    }
  }
  if (curGroup.length) beamGroups.push(curGroup);

  beamGroups.forEach(g => {
    if (g.length === 1) {
      // Single note — draw flags instead of beams
      inner += flagSym(g[0].cx + 3.5, stemTop, evBeams(g[0].dur, sub));
    } else {
      // Primary beam (eighth-note level) spans the whole group
      const bx1 = g[0].cx + 3.5, bx2 = g[g.length-1].cx + 3.5;
      inner += `<rect x="${bx1}" y="${stemTop}" width="${bx2-bx1}" height="3" class="staff-beam" rx="0.5"/>`;

      // Secondary beam (sixteenth level) — only between consecutive 16th-value notes
      if (maxBeamLevels >= 2) {
        let i = 0;
        while (i < g.length) {
          if (evBeams(g[i].dur, sub) >= 2) {
            let j = i;
            while (j < g.length && evBeams(g[j].dur, sub) >= 2) j++;
            if (j - i >= 2) {
              // Full secondary beam
              const sx1 = g[i].cx + 3.5, sx2 = g[j-1].cx + 3.5;
              inner += `<rect x="${sx1}" y="${stemTop+5}" width="${sx2-sx1}" height="3" class="staff-beam" rx="0.5"/>`;
            } else {
              // Beam stub for isolated 16th
              const stubX = g[i].cx + 3.5;
              const dir = (i === 0) ? 1 : -1;
              const sl = 6;
              const sX = dir > 0 ? stubX : stubX - sl;
              inner += `<rect x="${sX}" y="${stemTop+5}" width="${sl}" height="3" class="staff-beam" rx="0.5"/>`;
            }
            i = j;
          } else { i++; }
        }
      }
    }
  });

  // Tuplet bracket — spans all events (notes + rests)
  if (isTuplet) {
    const allCx = positioned.map(e => e.cx);
    const tx1 = Math.min(...allCx);
    const tx2 = Math.max(...allCx) + 3.5;
    inner += tupletBracket(tx1, tx2, stemTop - 5, sub.toString(), fs);
  }

  return staffSVG(inner, w, h);
}

// ══════════════════════════════════════════
// State
// ══════════════════════════════════════════
let tempo = 80;
let beatsPerBar = 4;
let barsPerFigure = 2;
let clickMode = "division"; // "downbeat", "quarter", "division"
let activeFigures = new Set(["quarter","eighth","triplet","sixteenth"]);
let randomOrder = true;
let isPlaying = false;
let audioCtx = null;
let schedulerTimer = null;

// ══════════════════════════════════════════
// Tempo UI
// ══════════════════════════════════════════
const tempoDisplay = document.getElementById("tempoDisplay");
const tempoSlider = document.getElementById("tempoSlider");

function setTempo(v) {
  tempo = Math.max(30, Math.min(300, Math.round(v)));
  tempoDisplay.textContent = tempo;
  tempoSlider.value = tempo;
}

tempoSlider.addEventListener("input", () => setTempo(+tempoSlider.value));
document.getElementById("tempoMinus5").addEventListener("click", () => setTempo(tempo - 5));
document.getElementById("tempoPlus5").addEventListener("click", () => setTempo(tempo + 5));

// Tap tempo
let tapTimes = [];
document.getElementById("tapBtn").addEventListener("click", () => {
  const now = performance.now();
  tapTimes.push(now);
  if (tapTimes.length > 6) tapTimes.shift();
  if (tapTimes.length >= 2) {
    const intervals = [];
    for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
    const avg = intervals.reduce((a,b) => a+b, 0) / intervals.length;
    setTempo(60000 / avg);
  }
  // Reset if gap > 2s
  if (tapTimes.length >= 2 && tapTimes[tapTimes.length-1] - tapTimes[tapTimes.length-2] > 2000) {
    tapTimes = [now];
  }
});

// ══════════════════════════════════════════
// Settings buttons
// ══════════════════════════════════════════
function buildOptRow(containerId, options, defaultVal, onChange) {
  const container = document.getElementById(containerId);
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (opt.value === defaultVal ? " active" : "");
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      container.querySelectorAll(".opt-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      onChange(opt.value);
    });
    container.appendChild(btn);
  });
}

// Time signature buttons (stacked numerator/denominator)
(function buildTimeSigRow() {
  const container = document.getElementById("beatsRow");
  [2,3,4,5,6,7].forEach(n => {
    const btn = document.createElement("button");
    btn.className = "ts-btn" + (n === 4 ? " active" : "");
    btn.innerHTML = `<span class="ts-num">${n}</span><span class="ts-line"></span><span class="ts-den">4</span>`;
    btn.addEventListener("click", () => {
      container.querySelectorAll(".ts-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      beatsPerBar = n;
    });
    container.appendChild(btn);
  });
})();

buildOptRow("barsRow",
  [1,2,4,8].map(n => ({ label: n, value: n })),
  2, v => { barsPerFigure = v; }
);
buildOptRow("clickRow",
  [
    { label: "None", value: "none" },
    { label: "Downbeat", value: "downbeat" },
    { label: "Quarter", value: "quarter" },
    { label: "All", value: "division" },
  ],
  "division", v => { clickMode = v; }
);

// ══════════════════════════════════════════
// Category tabs + figure buttons
// ══════════════════════════════════════════
let currentCat = "all";
const catTabsEl = document.getElementById("catTabs");
const figureGrid = document.getElementById("figureGrid");

// Build category tabs
CATEGORIES.forEach(cat => {
  const tab = document.createElement("button");
  tab.className = "cat-tab" + (cat.id === "all" ? " active" : "");
  tab.textContent = cat.label;
  tab.addEventListener("click", () => {
    currentCat = cat.id;
    catTabsEl.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    renderFigureGrid();
  });
  catTabsEl.appendChild(tab);
});

function addFigButton(key) {
  const btn = document.createElement("button");
  btn.className = "fig-btn" + (activeFigures.has(key) ? " active" : "");
  btn.innerHTML = buildFigureSVG(key, false) + `<span class="fig-label">${FIGURES[key].label}</span>`;
  btn.addEventListener("click", () => {
    if (activeFigures.has(key)) {
      activeFigures.delete(key);
      btn.classList.remove("active");
    } else {
      activeFigures.add(key);
      btn.classList.add("active");
    }
  });
  btn.dataset.figure = key;
  figureGrid.appendChild(btn);
}

function renderFigureGrid() {
  figureGrid.innerHTML = "";
  const catOrder = ["basic", "A", "B", "C", "other"];

  if (currentCat === "all") {
    // Show all categories with row labels
    catOrder.forEach((catId, ci) => {
      const catKeys = FIGURE_ORDER.filter(k => FIGURES[k].cat === catId);
      if (!catKeys.length) return;
      const lbl = document.createElement("div");
      const info = CATEGORIES.find(c => c.id === catId);
      lbl.textContent = info ? info.label : catId;
      lbl.style.cssText = `width:100%;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:${ci ? 10 : 0}px;margin-bottom:2px;`;
      figureGrid.appendChild(lbl);
      catKeys.forEach(addFigButton);
    });
  } else {
    FIGURE_ORDER.filter(k => FIGURES[k].cat === currentCat).forEach(addFigButton);
  }
}
renderFigureGrid();

// All / None affect visible category
document.getElementById("figAll").addEventListener("click", () => {
  const keys = FIGURE_ORDER.filter(k =>
    currentCat === "all" || FIGURES[k].cat === currentCat
  );
  keys.forEach(k => activeFigures.add(k));
  figureGrid.querySelectorAll(".fig-btn").forEach(b => b.classList.add("active"));
});
document.getElementById("figNone").addEventListener("click", () => {
  const keys = FIGURE_ORDER.filter(k =>
    currentCat === "all" || FIGURES[k].cat === currentCat
  );
  keys.forEach(k => activeFigures.delete(k));
  figureGrid.querySelectorAll(".fig-btn").forEach(b => b.classList.remove("active"));
});
document.getElementById("randomToggle").addEventListener("change", e => {
  randomOrder = e.target.checked;
});

// ══════════════════════════════════════════
// Audio — classic tick/click
// ══════════════════════════════════════════
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playClick(ctx, time, isDownbeat, isSubdivision) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain).connect(ctx.destination);

  if (isDownbeat) {
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.5, time);
  } else if (isSubdivision) {
    osc.frequency.value = 600;
    gain.gain.setValueAtTime(0.12, time);
  } else {
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.3, time);
  }
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
  osc.start(time);
  osc.stop(time + 0.05);
}

// ══════════════════════════════════════════
// Scheduler — look-ahead metronome
// ══════════════════════════════════════════
let currentBeat = 0;
let currentBar = 0;
let currentFigureIdx = 0;
let figureQueue = [];
let nextNoteTime = 0;
let currentSubdiv = 0;

function getActiveList() {
  const list = FIGURE_ORDER.filter(k => activeFigures.has(k));
  return list.length > 0 ? list : ["quarter"];
}

let nextQueue = []; // pre-built next queue so nextFigure() is always accurate

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQueue() {
  const list = getActiveList();
  figureQueue = randomOrder ? shuffleArray(list.slice()) : list.slice();
  currentFigureIdx = 0;
  buildNextQueue();
}

function buildNextQueue() {
  const list = getActiveList();
  nextQueue = randomOrder ? shuffleArray(list.slice()) : list.slice();
}

function currentFigure() {
  if (figureQueue.length === 0) buildQueue();
  return figureQueue[currentFigureIdx];
}
function nextFigure() {
  if (figureQueue.length === 0) buildQueue();
  if (currentFigureIdx + 1 < figureQueue.length) {
    return figureQueue[currentFigureIdx + 1];
  }
  // Next figure crosses into the pre-built next queue
  if (nextQueue.length === 0) buildNextQueue();
  return nextQueue[0];
}
function advanceFigure() {
  currentFigureIdx++;
  if (currentFigureIdx >= figureQueue.length) {
    // Transition to the pre-built next queue (which nextFigure() already peeked into)
    figureQueue = nextQueue;
    currentFigureIdx = 0;
    buildNextQueue();
  }
}

// ── Timeline events: audio scheduler pushes, rAF loop reads ──
// Each event: { time (audioCtx seconds), beat, bar, figKey, nextFigKey }
let timeline = [];
let lastShownIdx = -1;
let rafId = null;

// Build the playback area DOM once, then update parts in place
function renderPlaybackShell() {
  const area = document.getElementById("playbackArea");
  const fig = currentFigure();
  const nxt = nextFigure();

  let dotsHTML = '<div class="beat-dots" id="beatDots">';
  for (let i = 0; i < beatsPerBar; i++) {
    const db = i === 0 ? " downbeat" : "";
    dotsHTML += `<div class="beat-dot${db}" data-beat="${i}"></div>`;
  }
  dotsHTML += '</div>';

  area.innerHTML =
    `<div class="now-label">Now Playing</div>` +
    `<div class="now-figure" id="nowFigure">${buildFigureSVG(fig, true)}</div>` +
    dotsHTML +
    `<div class="bar-counter" id="barCounter">Bar 1 of ${barsPerFigure}</div>` +
    `<div class="next-label">Next Up</div>` +
    `<div class="next-figure" id="nextFigure">${buildFigureSVG(nxt, true)}</div>`;
}

// Lightweight update: just toggle dot classes and update text
function applyVisualState(beat, bar, figKey, nextFigKey, forceRedraw) {
  const dots = document.querySelectorAll("#beatDots .beat-dot");
  if (dots.length !== beatsPerBar || forceRedraw) {
    // Beats changed or figure changed — rebuild shell
    renderPlaybackShell();
    // Re-select dots after rebuild
    const newDots = document.querySelectorAll("#beatDots .beat-dot");
    newDots.forEach(d => d.classList.toggle("on", +d.dataset.beat === beat));
    return;
  }
  dots.forEach(d => d.classList.toggle("on", +d.dataset.beat === beat));
  const counter = document.getElementById("barCounter");
  if (counter) counter.textContent = `Bar ${bar + 1} of ${barsPerFigure}`;
  const nowFig = document.getElementById("nowFigure");
  if (nowFig && forceRedraw) nowFig.innerHTML = buildFigureSVG(figKey, true);
  const nxtFig = document.getElementById("nextFigure");
  if (nxtFig && forceRedraw) nxtFig.innerHTML = buildFigureSVG(nextFigKey, true);
}

// rAF visual loop — reads audio clock, finds current timeline event
function visualLoop() {
  if (!isPlaying) return;
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  // Find the latest event whose time has passed
  let idx = lastShownIdx;
  while (idx + 1 < timeline.length && timeline[idx + 1].time <= now) {
    idx++;
  }

  if (idx >= 0 && idx !== lastShownIdx) {
    const ev = timeline[idx];
    const prev = lastShownIdx >= 0 ? timeline[lastShownIdx] : null;
    const figChanged = !prev || prev.figKey !== ev.figKey;
    applyVisualState(ev.beat, ev.bar, ev.figKey, ev.nextFigKey, figChanged);
    lastShownIdx = idx;
  }

  // Trim old events to prevent unbounded growth (keep last 4 + future)
  if (lastShownIdx > 8) {
    const trim = lastShownIdx - 4;
    timeline.splice(0, trim);
    lastShownIdx -= trim;
  }

  rafId = requestAnimationFrame(visualLoop);
}

const SCHEDULE_AHEAD = 0.15; // seconds — schedule audio slightly ahead
const LOOKAHEAD_MS = 25;

function scheduler() {
  const ctx = getAudioCtx();
  const fig = currentFigure();
  const figData = FIGURES[fig];
  const subPerBeat = figData.divisor / 4;
  const beatDuration = 60.0 / tempo;
  const subDuration = beatDuration / subPerBeat;
  const hits = figData.hits || new Array(Math.max(1, Math.round(subPerBeat))).fill(1);

  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
    const isDownbeat = (currentBeat === 0 && currentSubdiv === 0);
    const isBeatStart = (currentSubdiv === 0);
    const isSubdivision = !isBeatStart;
    const isHit = hits[currentSubdiv % hits.length];

    // Schedule audio click
    if (clickMode === "downbeat" && isDownbeat) {
      playClick(ctx, nextNoteTime, true, false);
    } else if (clickMode === "quarter" && isBeatStart) {
      playClick(ctx, nextNoteTime, isDownbeat, false);
    } else if (clickMode === "division" && isHit) {
      playClick(ctx, nextNoteTime, isDownbeat, isSubdivision);
    }
    // clickMode === "none" → no audio, visual only

    // Push beat-start events onto timeline for the rAF loop
    if (isBeatStart) {
      timeline.push({
        time: nextNoteTime,
        beat: currentBeat,
        bar: currentBar,
        figKey: currentFigure(),
        nextFigKey: nextFigure()
      });
    }

    // Advance subdivision
    currentSubdiv++;
    if (currentSubdiv >= subPerBeat) {
      currentSubdiv = 0;
      currentBeat++;
      if (currentBeat >= beatsPerBar) {
        currentBeat = 0;
        currentBar++;
        if (currentBar >= barsPerFigure) {
          currentBar = 0;
          advanceFigure();
        }
      }
    }

    nextNoteTime += subDuration;
  }
}

function startPlayback() {
  const ctx = getAudioCtx();
  if (ctx.state === "suspended") ctx.resume();

  currentBeat = 0;
  currentBar = 0;
  currentSubdiv = 0;
  timeline = [];
  lastShownIdx = -1;
  buildQueue();
  nextNoteTime = ctx.currentTime + 0.05;

  isPlaying = true;
  renderPlaybackShell();
  schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
  rafId = requestAnimationFrame(visualLoop);

  const btn = document.getElementById("transportBtn");
  btn.textContent = "■ Stop";
  btn.className = "play-stop-btn stop";
}

function stopPlayback() {
  isPlaying = false;
  if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

  const btn = document.getElementById("transportBtn");
  btn.textContent = "▶ Play";
  btn.className = "play-stop-btn play";
  // Keep the playback area as-is so the user sees where it stopped
}

document.getElementById("transportBtn").addEventListener("click", () => {
  if (isPlaying) stopPlayback(); else startPlayback();
});

// Keyboard shortcut: space = play/stop
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") {
    e.preventDefault();
    if (isPlaying) stopPlayback(); else startPlayback();
  }
});
</script>
